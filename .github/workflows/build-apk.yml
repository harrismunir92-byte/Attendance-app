name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm run build

      - name: Generate Android Project & APK
        run: |
          npx cap add android
          npx cap sync android
          
          # Sahi tarah se Kotlin conflict resolve karne ke liye
          echo "allprojects { repositories { google() mavenCentral() } }" >> android/build.gradle
          echo "subprojects { afterEvaluate { project -> if (project.hasProperty('android')) { project.android { compileSdk 34 } } } }" >> android/build.gradle
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttendPro-HR-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
 
